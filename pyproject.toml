[project]
name = "easyem-saas"
version = "0.1.0"
description = "EasyEM SaaS backend — accounts, auth, credit ledger"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "numpy>=1.26,<2",
]
[project.scripts]
easyem-worker = "easyem.jobs.worker:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags `Depends(...)` in argument defaults. That is the FastAPI
# dependency-injection idiom, not a mutable-default bug.
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["easyem*"]
